plugins { id 'com.android.application' }
android {
    compileSdk 32
    defaultConfig {
        applicationId 'g30.sixcamera.app'
        minSdk 26
        targetSdk 32
        versionCode 4
        versionName '1.3.0'
    }
    buildTypes { release { minifyEnabled false } }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
